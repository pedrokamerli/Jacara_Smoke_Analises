# EXEMPLO PÚBLICO, SEM CREDENCIAIS REAIS.
# Copie localmente para .streamlit/secrets.toml, que não deve entrar no Git.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "SUBSTITUA_POR_SEGREDO_ALEATORIO_DE_32_BYTES_OU_MAIS"
client_id = "SUBSTITUA_PELO_CLIENT_ID_GOOGLE"
client_secret = "SUBSTITUA_PELO_CLIENT_SECRET_GOOGLE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
allowed_emails = ["proprietario@example.com", "analista@example.com"]
max_session_seconds = 3600
# Todas as contas acima podem atualizar; não concede acesso a contas externas.
uploads_for_all_allowed = true
