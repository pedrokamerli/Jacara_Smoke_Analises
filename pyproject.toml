[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacare-smoke-analytics"
version = "0.1.0"
description = "Pipeline de analytics para vendas, delivery e marketing da Jacaré Smoke House"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
